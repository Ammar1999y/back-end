# Smoke runs in CI, twice: once in the job's own `development` environment and
# once with a production-shaped one, because those evaluate different module
# graphs. Neither belongs here — a pre-push hook that needs a full production
# environment is a pre-push hook that gets disabled. The fail-closed startup
# gates ARE asserted locally, in `tests/process/startup-gates.test.ts`.
# Scanners run through mise so local checks use the pinned toolchain.

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: '*.{ts,tsx,mts,cts}'
      run: bunx tsc --noEmit
    lint:
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs}'
      # `--no-warn-ignored` because this hook passes staged files to eslint by
      # name. `eslint .` skips ignored paths silently, but an explicit argument
      # that matches an ignore pattern is reported as a warning — and with
      # `--max-warnings 0` that fails the commit. `bench/**` is eslint-ignored on
      # purpose (see eslint.config.mjs) while still being tracked, so without
      # this flag every commit touching the benchmark harness would be blocked
      # for files eslint was never meant to check.
      run: bunx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    format:
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,yml,yaml,css}'
      run: bunx prettier --check {staged_files}
    secrets:
      run: mise exec -- gitleaks git --staged --redact --verbose --no-banner

# Two STAGES, not one parallel group, and the split is the fix for a
# deterministic collision rather than a preference.
#
# `tests/unit/lint-security-gate.test.ts` writes a deliberately rule-violating
# probe into the tree (it has to — `eslint.config.mjs` scopes its type-aware
# block by `files: ['lib/**/*.ts', …]`, so a probe outside the repository would
# not be linted with a program at all). Every gate in `gates` below reads the
# whole tree: `eslint .`, `prettier --check .` and `find-unused-files.ts` all see
# that probe while it exists, and the last one was reproduced exiting 1 with
# `1 unreachable file(s) of 229 scanned: security-lint-probe-10952.ts`. Running
# them concurrently made `bun run verify` fail naming a file that no longer
# exists by the time the developer looks — the classic reason a gate gets
# disabled.
pre-push: &full_verify
  jobs:
    - name: gates
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: bunx tsc --noEmit
          - name: lint
            run: bunx eslint . --max-warnings 0
          - name: format
            run: bunx prettier --check .
          - name: audit
            run: bun run audit
            fail_text:
              'a vulnerable dependency, or the advisories registry is down (the
              script retries a 5xx three times before giving up)'
          # The half of the Bun-only guard that a skipped `preinstall` cannot
          # hide. `--ignore-scripts` (flag, bunfig, or .npmrc) silences the
          # preinstall hook silently, so a foreign lockfile can reach the tree
          # with no install-time complaint at all. Run here it costs nothing and
          # catches that state before it is pushed.
          - name: runtime
            run: bun scripts/require-bun.mjs
            fail_text: 'wrong package manager, an outdated Bun, or a foreign lockfile'
          # The whole `find:unused-files` script, not just its first half: the
          # `bunx knip` behind the `&&` is what checks dependencies, exports and
          # types, and running only the scanner here let an unlisted dependency
          # reach CI. Whatever CI runs under this name, this gate runs too.
          - name: routes
            run: bun run find:unused-files
            fail_text:
              'unreachable file, a handler no routes.ts entry routes (see the
              comment in scripts/find-unused-files.ts), or a knip finding'
          - name: dedupe
            run: bun dedupe --check
            fail_text: 'a dependency resolves to more than one version'
          - name: secrets
            run: mise exec -- gitleaks git . --redact --verbose --no-banner
            fail_text: 'leaked secret, or tools not installed (mise install)'
          - name: sast
            run: mise exec -- semgrep scan --config=p/typescript
              --config=p/secrets --error --metrics=off
            fail_text: 'semgrep findings, or tools not installed (mise install)'
          - name: workflows
            run: mise exec -- actionlint
            fail_text: 'workflow errors, or tools not installed (mise install)'
    # AFTER the group above, because this tier writes into the tree.
    #
    # Deliberately the CHEAP tier and not `test:all`: the integration tiers need
    # a PostgreSQL server, and a pre-push hook that needs a database is a
    # pre-push hook that gets disabled. Run `bun run test:all` by hand, or let
    # the `tests` CI job do it.
    - name: test
      run: bun run test

verify: *full_verify

fix:
  # Sequential: both commands rewrite the same files.
  piped: true
  commands:
    format:
      run: bunx prettier --write .
    lint:
      run: bunx eslint . --fix
