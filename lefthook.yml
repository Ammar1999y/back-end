# Local gates. GitHub Actions re-runs the same checks, so a skipped hook
# (`--no-verify`, or a clone that never ran `bun install`) is still caught.
#
#   bun run precommit  fix what is auto-fixable, then run every gate
#   bun run verify     gates only, no writes — same set as pre-push
#   bun run fix        writes only
#
# `verify` is NOT the same set as CI, and the previous version of this comment
# claimed it was. CI additionally runs `bun run smoke`, which boots the real
# server and therefore needs a full production-shaped environment — deliberately
# left out of the local hooks, because a developer without those variables would
# have every push blocked by a gate that says nothing about their change. The two
# checks that DID belong here and were missing (the probe suite and the
# registration scanner) are below; both need no environment at all, which is why
# CI's own steps for them carry no `env:` block.
#
# The scanners run through `mise exec` so they are the exact versions pinned in
# mise.toml — the same file CI installs from. Run `mise install` once.

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: '*.{ts,tsx,mts,cts}'
      run: bunx tsc --noEmit
    lint:
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs}'
      # `--no-warn-ignored` because this hook passes staged files to eslint by
      # name. `eslint .` skips ignored paths silently, but an explicit argument
      # that matches an ignore pattern is reported as a warning — and with
      # `--max-warnings 0` that fails the commit. `bench/**` is eslint-ignored on
      # purpose (see eslint.config.mjs) while still being tracked, so without
      # this flag every commit touching the benchmark harness would be blocked
      # for files eslint was never meant to check.
      run: bunx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    format:
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,yml,yaml,css}'
      run: bunx prettier --check {staged_files}
    secrets:
      run: mise exec -- gitleaks git --staged --redact --verbose --no-banner

pre-push: &full_verify
  parallel: true
  commands:
    typecheck:
      run: bunx tsc --noEmit
    lint:
      run: bunx eslint . --max-warnings 0
    format:
      run: bunx prettier --check .
    audit:
      run: bun audit
    # The half of the Bun-only guard that a skipped `preinstall` cannot hide.
    # `--ignore-scripts` (flag, bunfig, or .npmrc) silences the preinstall hook
    # silently, so a foreign lockfile can reach the tree with no install-time
    # complaint at all. Run here it costs nothing and catches that state before
    # it is pushed.
    runtime:
      run: bun scripts/require-bun.mjs
      fail_text: 'wrong package manager, an outdated Bun, or a foreign lockfile'
    # The unit tier and the route-registration gate. Both are CI steps
    # (.github/workflows/ci.yml) and neither needs any environment, so there was
    # no reason for a push to reach CI before finding out.
    #
    # Deliberately the CHEAP tier and not `test:all`: the integration tiers need
    # a PostgreSQL server, and a pre-push hook that needs a database is a
    # pre-push hook that gets disabled. Run `bun run test:all` by hand, or let
    # the `tests` CI job do it.
    test:
      run: bun run test
    routes:
      run: bun scripts/find-unused-files.ts
      fail_text:
        'unreachable file, or a handler no routes.ts entry routes (see the
        comment in scripts/find-unused-files.ts)'
    secrets:
      run: mise exec -- gitleaks git . --redact --verbose --no-banner
      fail_text: 'leaked secret, or tools not installed (mise install)'
    sast:
      run: mise exec -- semgrep scan --config=p/typescript --config=p/secrets
        --error --metrics=off
      fail_text: 'semgrep findings, or tools not installed (mise install)'
    workflows:
      run: mise exec -- actionlint
      fail_text: 'workflow errors, or tools not installed (mise install)'

verify: *full_verify

fix:
  # Sequential: both commands rewrite the same files.
  piped: true
  commands:
    format:
      run: bunx prettier --write .
    lint:
      run: bunx eslint . --fix
