name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLED_OTP_CHANNELS: email
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      DATABASE_URL: postgres://ci:ci@db.example.com/ci?sslmode=require
      BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-000000
      SQLITE_DIR: /tmp/ci-sqlite
      PASSWORD_PEPPER_ACTIVE_ID: ci
      PASSWORD_PEPPER_KEYRING: '{"ci":{"generation":1,"secret":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
      OTP_HMAC_ACTIVE_ID: ci
      OTP_HMAC_KEYRING: '{"ci":{"generation":1,"secret":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No bun-version: the action reads package.json's `packageManager` field,
      # so the version lives in exactly one place and Renovate bumps it there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Build
        # Generates the OpenAPI artefact from the production-filtered route
        # table. It is here rather than only in the deploy because a route table
        # inconsistent with its request schemas throws only under that filter —
        # which made the endpoint 500 in production while every development
        # check passed.
        run: bun run build
      - name: Unit tests
        # The cheap tier: no database, no port. `bun run test` is
        # `bun tests/helpers/run.ts unit`, which runs `bun test --isolate
        # tests/unit`.
        #
        # It used to be `bun test scripts/probe/local`, and that was a silent
        # hole: `bun test <path>` treats its arguments as filename FILTERS, so a
        # test file outside that directory was skipped and the run still exited
        # 0. `bunfig.toml`'s `[test] root` and
        # `tests/unit/harness-layout.test.ts` close it from both ends — the
        # latter fails if any file under `tests/` is in no tier.
        run: bun run test
      - name: Unreachable files and unregistered handlers
        # This scanner checks handler registration; Knip below covers files under
        # `tests/`, which this import graph treats as entry points.
        run: bun scripts/find-unused-files.ts
      - name: Unused files, exports and types
        run: bun run find:unused-files
      - name: Duplicate dependency versions
        run: bun dedupe --check
      - name: Boot smoke test
        # Replaces `next build`. A Bun server has no build artefact, so this is
        # what forces the module graph to evaluate — lib/env.server.ts throws at
        # load on a missing var, and the SQLite stores open lazily. It boots the
        # real server and asserts readiness, headers, routing and the maintenance
        # guard.
        #
        # No PostgreSQL or network access is required — but that is now a
        # property of the driver rather than a free consequence of it. The old
        # `neon-http` client was a `fetch` wrapper that could not connect until
        # a query ran. `bun:sql` is a real TCP pool, and this step works only
        # because Bun opens it LAZILY: `new SQL(url)` against the unreachable
        # host below constructs without a connection attempt, and `close()` on a
        # never-connected pool resolves immediately. If a startup ping or an
        # eager connect is ever added, this step fails and the failure will look
        # like a network problem. See reports/test-strategy.md §7.4e.
        #
        # These are throwaway values shaped to pass validation only — no real
        # credential belongs in this file.
        run: bun run smoke

  # The database-backed tiers. Their own job because they need a PostgreSQL
  # service container, and because keeping them out of `verify` means a lint
  # failure and an integration failure are two separate signals.
  #
  # Nothing here is preserved between runs: the container dies with the runner
  # VM, so a destructive suite has nothing to damage and needs no cleanup logic.
  # The harness still provisions and drops its own databases, because the same
  # command has to be safe on a developer machine where that is not true.
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Pinned to the VPS's major. A different major trades one fidelity gap
        # for a smaller one rather than closing it.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Bun honors TZ for tests. +03 keeps timestamp decoding bugs visible.
      TZ: Asia/Riyadh
      REQUIRE_NON_UTC_TZ: '1'
      # The harness reads this and derives every database name from it; the
      # database component is ignored (it connects to `postgres` for DDL).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # `DATABASE_URL` is overwritten per worker by the preload. It is set here
      # only because `lib/env.server.ts` requires it to be PRESENT at module
      # load, and the value must not be the one the tests end up using.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PUBLIC_URL: http://localhost:3000
      # Email is the enabled OTP channel for this tier; the integration suite
      # (tests/integration/self-service-credentials.test.ts) asserts phone OTP
      # channels are disabled to test rejection and refusal boundaries.
      NEXT_PUBLIC_ENABLED_OTP_CHANNELS: email
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-000000
      SQLITE_DIR: /tmp/ci-sqlite
      SQLITE_MAINTENANCE_TOKEN: ci-maintenance-token-0123456789012
      PASSWORD_PEPPER_ACTIVE_ID: ci
      PASSWORD_PEPPER_KEYRING: '{"ci":{"generation":1,"secret":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
      OTP_HMAC_ACTIVE_ID: ci
      OTP_HMAC_KEYRING: '{"ci":{"generation":1,"secret":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Its own step, deliberately. `package.json` was once edited without
      # regenerating `bun.lock`, so every CI install would have failed while
      # every local command passed, because `node_modules` was already
      # populated. No test that assumes an installed tree can detect that.
      - run: bun install --frozen-lockfile
      - name: Integration tests
        # The harness migration builds the test template, so no separate migrate
        # step can drift from the schema used by the tests.
        run: >-
          bun run test:integration --
          --reporter=junit --reporter-outfile=reports/junit-integration.xml
          --coverage --coverage-reporter=text
      - name: Publish integration test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-integration
          path: reports/junit-integration.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Process tests
        # Its own step for the same reason `bun run smoke` is separate: every
        # test here owns a real socket, a real child process or a real signal.
        # It is also the tier where the win32-skipped cases actually run.
        run: bun run test:process

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Lint workflows
        run: actionlint

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
