name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No bun-version: the action reads package.json's `packageManager` field,
      # so the version lives in exactly one place and Renovate bumps it there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Probe tests
        # These cover the SQLite rate-limit and cache invariants. Half of each
        # SQLite probe runs in a Node child: `better-sqlite3` is built against
        # the V8 C++ API and cannot load under Bun, which is what runs the tests.
        # `bun test` exits non-zero on failure, so no extra guard is needed.
        # `node --version` first so a runner without Node fails here with an
        # obvious message rather than inside a spawned child.
        run: node --version && bun run test
      - name: Build
        # lib/env.server.ts hard-fails at module load on a missing var, so the
        # build needs a complete set. These are throwaway values shaped to pass
        # validation only — no real credential belongs in this file.
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_URL: https://example.com
          NEXT_PUBLIC_ENABLED_OTP_CHANNELS: email
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          DATABASE_URL: postgres://ci:ci@db.example.com/ci?sslmode=require
          BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-000000
          # SQLITE_DIR has no production default so an unmounted volume cannot
          # boot silently; the build only needs it to resolve paths.
          SQLITE_DIR: /tmp/ci-sqlite
          PASSWORD_PEPPER_ACTIVE_ID: ci
          PASSWORD_PEPPER_KEYRING: '{"ci":{"generation":1,"secret":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
        run: bun run build

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Lint workflows
        run: actionlint

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
