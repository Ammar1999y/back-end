name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No bun-version: the action reads package.json's `packageManager` field,
      # so the version lives in exactly one place and Renovate bumps it there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Probe tests
        # These cover the SQLite rate-limit and cache invariants. The SQLite
        # probes spawn a Bun child so a failed case cannot leak an open file
        # handle into the rest of the suite; the driver is `bun:sqlite`, so no
        # Node runtime is involved any more. `bun test` exits non-zero on
        # failure, so no extra guard is needed.
        run: bun run test
      - name: Unreachable files and unregistered handlers
        # The scanner alone, not `bun run find:unused-files`, which also runs
        # knip. Knip currently reports 85 unused exports and 34 unused exported
        # types that predate this work; gating on it would fail every build
        # until that is cleaned up, which is tracked in TODO.md. This step is a
        # real gate: non-zero on an unreachable file AND on a handler module
        # that `routes.ts` does not import — and the second check is the one the
        # previous scanner could not make, because reachability through a
        # commented-out import is not registration.
        run: bun scripts/find-unused-files.ts
      - name: Boot smoke test
        # Replaces `next build`. A Bun server has no build artefact, so this is
        # what forces the module graph to evaluate — lib/env.server.ts throws at
        # load on a missing var, and the SQLite stores open lazily. It boots the
        # real server and asserts readiness, headers, routing and the maintenance
        # guard.
        #
        # No PostgreSQL or network access is required — but that is now a
        # property of the driver rather than a free consequence of it. The old
        # `neon-http` client was a `fetch` wrapper that could not connect until
        # a query ran. `bun:sql` is a real TCP pool, and this step works only
        # because Bun opens it LAZILY: `new SQL(url)` against the unreachable
        # host below constructs without a connection attempt, and `close()` on a
        # never-connected pool resolves immediately. If a startup ping or an
        # eager connect is ever added, this step fails and the failure will look
        # like a network problem. See reports/test-strategy.md §7.4e.
        #
        # These are throwaway values shaped to pass validation only — no real
        # credential belongs in this file.
        env:
          NODE_ENV: development
          # `PUBLIC_URL` is the name now; `NEXT_PUBLIC_URL` still resolves as a
          # legacy alias. See lib/env.js and reports/coolify-deployment.md.
          PUBLIC_URL: http://localhost:3000
          NEXT_PUBLIC_ENABLED_OTP_CHANNELS: email
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          DATABASE_URL: postgres://ci:ci@db.example.com/ci?sslmode=require
          BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-000000
          # SQLITE_DIR has no production default so an unmounted volume cannot
          # boot silently.
          SQLITE_DIR: /tmp/ci-sqlite
          PASSWORD_PEPPER_ACTIVE_ID: ci
          PASSWORD_PEPPER_KEYRING: '{"ci":{"generation":1,"secret":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}}'
        run: bun run smoke

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Lint workflows
        run: actionlint

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
